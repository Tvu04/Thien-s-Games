<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Aries Arcade, a personal collection of games, music, and shows by Tvu04."><meta name="theme-color" content="#100e17"><link rel="icon" href="logo.svg" type="image/svg+xml"><title>K-Pop Bias Bracket · Aries Arcade</title><link rel="stylesheet" href="style.css?v=single-nav-link"><link rel="stylesheet" href="collections.css?v=single-nav-link"><style>
#choices:not([hidden]) { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,14rem),1fr)); gap:1rem; max-width:44rem; }
#choices button { background:var(--panel); color:var(--text); border:1px solid var(--line); padding:1.25rem; min-height:7rem; font:inherit; text-align:left; cursor:pointer; }
#choices button:is(:hover,:focus-visible) { border-color:var(--lime); }
#choices strong,#choices span { display:block; }
#choices strong { font-size:1.35rem; }
#choices span { color:var(--purple); margin-top:.4rem; }
#replay { border:0; cursor:pointer; }
#replay[hidden] { display:none; }
</style></head>
<body><header class="shell top collections-top"><a class="brand" href="./"><img src="logo.svg" alt="" width="44" height="44"><span>ARIES<b>ARCADE</b></span></a><nav class="collections-nav" aria-label="Main navigation"><a href="game-library.html">Game Library</a><a href="k-pop-k-dramas.html">K-Pop / K-Dramas</a><a href="songs-artists.html">Songs / Artists</a><a href="movies-tv.html">Movies / TV Shows</a></nav></header>
<main class="shell collection-page">
  <p class="eyebrow"><span></span> ARIES ARCADE / MINI-GAME</p>
  <h1 class="collection-title">K-Pop Bias Bracket</h1>
  <p>Eight songs. Seven picks. One winner.</p>
  <p id="round" class="eyebrow" aria-live="polite"></p>
  <h2 id="prompt" tabindex="-1" aria-live="polite"></h2>
  <div id="choices" hidden>
    <button type="button"><strong></strong><span></span></button>
    <button type="button"><strong></strong><span></span></button>
  </div>
  <button id="replay" class="button" type="button" hidden>Play Again</button>
  <noscript><p>Enable JavaScript to play the bracket.</p></noscript>
</main><footer class="shell foot"><span>ARIES ARCADE</span><a href="https://github.com/Tvu04">TVU04 ON GITHUB ↗</a></footer><script>
const songs = [
  ["Strategy", "TWICE"],
  ["Fancy", "TWICE"],
  ["Sugar Rush Ride", "TXT"],
  ["Is This Love", "XG"],
  ["No Good", "XG"],
  ["Deserve", "BABYMONSTER"],
  ["Birthday Wish", "NMIXX"],
  ["Bloody Paradise", "ENHYPEN"]
];

const status = document.querySelector("#round");
const heading = document.querySelector("#prompt");
const choices = [...document.querySelectorAll("#choices button")];
const replay = document.querySelector("#replay");
let entrants, winners, match;

function render() {
  if (entrants.length === 1) {
    const [title, artist] = entrants[0];
    status.textContent = "BRACKET COMPLETE";
    heading.textContent = title + " by " + artist + " wins!";
    document.querySelector("#choices").hidden = true;
    replay.hidden = false;
    replay.focus();
    return;
  }
  const round = {8: "Quarterfinal", 4: "Semifinal", 2: "Final"};
  status.textContent = round[entrants.length] + " · Match " + (match + 1) + " of " + entrants.length / 2;
  choices.forEach((button, index) => {
    const [title, artist] = entrants[match * 2 + index];
    button.querySelector("strong").textContent = title;
    button.querySelector("span").textContent = artist;
  });
}

function start() {
  entrants = [...songs];
  for (let index = entrants.length - 1; index > 0; index--) {
    const other = Math.floor(Math.random() * (index + 1));
    [entrants[index], entrants[other]] = [entrants[other], entrants[index]];
  }
  winners = [];
  match = 0;
  heading.textContent = "Which song are you keeping?";
  document.querySelector("#choices").hidden = false;
  replay.hidden = true;
  render();
}

choices.forEach((button, index) => {
  button.addEventListener("click", () => {
    winners.push(entrants[match * 2 + index]);
    match++;
    if (match === entrants.length / 2) {
      entrants = winners;
      winners = [];
      match = 0;
    }
    render();
    if (entrants.length > 1) heading.focus();
  });
});
replay.addEventListener("click", () => {
  start();
  heading.focus();
});
start();
</script></body></html>
